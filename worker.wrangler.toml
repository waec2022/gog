# Deploy with:  npx wrangler deploy -c worker.wrangler.toml
name = "campus-guide-publish"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
GITHUB_OWNER = "YOUR-GITHUB-USERNAME"
GITHUB_REPO = "campus-guide"
GITHUB_BRANCH = "main"
# Origin(s) of the deployed Editor (no trailing slash). Comma-separate several.
EDITOR_ORIGIN = "https://campus-guide-editor.pages.dev"

# Media storage: a Cloudflare R2 bucket (free tier: 10 GB storage, no egress fees). Create it first:
#   wrangler r2 bucket create campus-guide-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "campus-guide-media"

# Optional: public media address if you attach a custom domain / public access to the R2 bucket.
# Leave unset to serve media through this Worker at /media/ (cached at the edge).
# MEDIA_PUBLIC_BASE = "https://media.your-domain.com"

# Optional: rebuild hourly so expired records leave the static build even if nobody publishes.
# Needs the secret DEPLOY_HOOK_URL (Pages > Settings > Builds > Deploy hooks).
# [triggers]
# crons = ["0 * * * *"]

# Secrets (NOT here): wrangler secret put GITHUB_TOKEN / EDITOR_KEY / DEPLOY_HOOK_URL
